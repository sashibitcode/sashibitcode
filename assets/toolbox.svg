<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-labelledby="tb-t">
  <title id="tb-t">~/ toolbox - Developer Tech Stack</title>
  <defs>
    <linearGradient id="tb-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E172A"/>
      <stop offset="100%" stop-color="#070B13"/>
    </linearGradient>
    <clipPath id="tb-clip"><rect width="1200" height="340" rx="16"/></clipPath>
  </defs>
  <style>
    .tb-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "JetBrains Mono", monospace; }
  </style>

  <g clip-path="url(#tb-clip)">
    <rect width="1200" height="340" fill="url(#tb-bg)"/>
    <rect x="0.5" y="0.5" width="1199" height="339" rx="15.5" fill="none" stroke="#3B82F6" stroke-opacity=".3" stroke-width="1"/>

    <!-- Header Strip -->
    <text x="36" y="40" fill="#38BDF8" font-size="13" class="tb-mono" font-weight="bold">~/ TOOLBOX</text>
    <text x="135" y="40" fill="#64748B" font-size="13" class="tb-mono">· REAL CORE CAPABILITIES &amp; LIBRARIES</text>

    <!-- COLUMN 1: LANGUAGES & QUERYING -->
    <g transform="translate(36, 68)">
      <rect width="360" height="236" rx="10" fill="#090E1A" stroke="#1E293B" stroke-width="1"/>
      <rect width="360" height="4" rx="2" fill="#3B82F6"/>
      <text x="20" y="32" fill="#FFFFFF" font-size="12" class="tb-mono" font-weight="bold">01 / LANGUAGES &amp; QUERYING</text>

      <g transform="translate(20, 52)">
        <rect width="90" height="30" rx="6" fill="#172554"/><text x="12" y="19" fill="#93C5FD" font-size="11" class="tb-mono">Python</text>
        <rect x="100" width="85" height="30" rx="6" fill="#172554"/><text x="112" y="19" fill="#93C5FD" font-size="11" class="tb-mono">SQL</text>
        <rect x="195" width="110" height="30" rx="6" fill="#172554"/><text x="207" y="19" fill="#93C5FD" font-size="11" class="tb-mono">TypeScript</text>
        
        <rect y="40" width="105" height="30" rx="6" fill="#172554"/><text x="12" y="59" fill="#93C5FD" font-size="11" class="tb-mono">JavaScript</text>
        <rect x="115" y="40" width="70" height="30" rx="6" fill="#172554"/><text x="127" y="59" fill="#93C5FD" font-size="11" class="tb-mono">C++</text>
        <rect x="195" y="40" width="80" height="30" rx="6" fill="#172554"/><text x="207" y="59" fill="#93C5FD" font-size="11" class="tb-mono">HTML5</text>

        <rect y="80" width="75" height="30" rx="6" fill="#172554"/><text x="12" y="99" fill="#93C5FD" font-size="11" class="tb-mono">CSS3</text>
        <rect x="85" y="80" width="105" height="30" rx="6" fill="#172554"/><text x="97" y="99" fill="#93C5FD" font-size="11" class="tb-mono">Bash/CLI</text>
      </g>
    </g>

