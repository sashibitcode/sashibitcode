        <rect x="230" y="40" width="80" height="30" rx="6" fill="#2E101A"/><text x="242" y="59" fill="#FCA5A5" font-size="11" class="tb-mono">Excel</text>

        <rect y="80" width="95" height="30" rx="6" fill="#2E101A"/><text x="12" y="99" fill="#FCA5A5" font-size="11" class="tb-mono">Matplotlib</text>
        <rect x="105" y="80" width="90" height="30" rx="6" fill="#2E101A"/><text x="117" y="99" fill="#FCA5A5" font-size="11" class="tb-mono">Seaborn</text>
        <rect x="205" y="80" width="105" height="30" rx="6" fill="#2E101A"/><text x="217" y="99" fill="#FCA5A5" font-size="11" class="tb-mono">EDA Pipelines</text>
      </g>
    </g>

    <!-- COLUMN 3: FRAMEWORKS & CLOUD TOOLS -->
    <g transform="translate(804, 68)">
      <rect width="360" height="236" rx="10" fill="#090E1A" stroke="#1E293B" stroke-width="1"/>
      <rect width="360" height="4" rx="2" fill="#38BDF8"/>
      <text x="20" y="32" fill="#FFFFFF" font-size="12" class="tb-mono" font-weight="bold">03 / FRAMEWORKS &amp; TOOLS</text>

      <g transform="translate(20, 52)">
        <rect width="85" height="30" rx="6" fill="#0C2538"/><text x="12" y="19" fill="#7DD3FC" font-size="11" class="tb-mono">MySQL</text>
        <rect x="95" width="105" height="30" rx="6" fill="#0C2538"/><text x="107" y="19" fill="#7DD3FC" font-size="11" class="tb-mono">PostgreSQL</text>
        <rect x="210" width="85" height="30" rx="6" fill="#0C2538"/><text x="222" y="19" fill="#7DD3FC" font-size="11" class="tb-mono">FastAPI</text>

        <rect y="40" width="115" height="30" rx="6" fill="#0C2538"/><text x="12" y="59" fill="#7DD3FC" font-size="11" class="tb-mono">Next.js / React</text>
        <rect x="125" y="40" width="75" height="30" rx="6" fill="#0C2538"/><text x="137" y="59" fill="#7DD3FC" font-size="11" class="tb-mono">Docker</text>
        <rect x="210" y="40" width="75" height="30" rx="6" fill="#0C2538"/><text x="222" y="59" fill="#7DD3FC" font-size="11" class="tb-mono">Vercel</text>

        <rect y="80" width="60" height="30" rx="6" fill="#0C2538"/><text x="12" y="99" fill="#7DD3FC" font-size="11" class="tb-mono">Git</text>
        <rect x="70" y="80" width="80" height="30" rx="6" fill="#0C2538"/><text x="82" y="99" fill="#7DD3FC" font-size="11" class="tb-mono">GitHub</text>
        <rect x="160" y="80" width="130" height="30" rx="6" fill="#0C2538"/><text x="172" y="99" fill="#7DD3FC" font-size="11" class="tb-mono">Jupyter Notebook</text>
