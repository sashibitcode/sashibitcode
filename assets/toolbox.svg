    <g transform="translate(420, 68)">
      <rect width="360" height="236" rx="10" fill="#090E1A" stroke="#1E293B" stroke-width="1"/>
      <rect width="360" height="4" rx="2" fill="#EF4444"/>
      <text x="20" y="32" fill="#FFFFFF" font-size="12" class="tb-mono" font-weight="bold">02 / DATA ANALYTICS &amp; ML</text>

      <g transform="translate(20, 52)">
        <rect width="100" height="30" rx="6" fill="#2E101A"/><text x="12" y="19" fill="#FCA5A5" font-size="11" class="tb-mono">Power BI</text>
        <rect x="110" width="90" height="30" rx="6" fill="#2E101A"/><text x="122" y="19" fill="#FCA5A5" font-size="11" class="tb-mono">Pandas</text>
        <rect x="210" width="85" height="30" rx="6" fill="#2E101A"/><text x="222" y="19" fill="#FCA5A5" font-size="11" class="tb-mono">NumPy</text>

