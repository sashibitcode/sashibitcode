<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" width="1200" height="230" role="img" aria-labelledby="tb-t">
  <title id="tb-t">~/ toolbox - Developer Tech Stack</title>
  <defs>
    <linearGradient id="tb-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E172A"/>
      <stop offset="100%" stop-color="#070B13"/>
    </linearGradient>
    <clipPath id="tb-clip"><rect width="1200" height="230" rx="16"/></clipPath>
  </defs>
  <style>
    .tb-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "JetBrains Mono", monospace; }
  </style>

  <g clip-path="url(#tb-clip)">
    <!-- Base Card -->
    <rect width="1200" height="230" fill="url(#tb-bg)"/>
    <rect x="0.5" y="0.5" width="1199" height="229" rx="15.5" fill="none" stroke="#3B82F6" stroke-opacity=".25" stroke-width="1"/>

    <!-- Section Title Centered: ~/ toolbox -->
    <text x="600" y="44" fill="#FFFFFF" font-size="22" class="tb-mono" font-weight="bold" text-anchor="middle">
      <tspan fill="#38BDF8">~/</tspan> toolbox
    </text>

    <!-- ================= ROW 1: 9 SQUIRCLE TILES (CENTERED) ================= -->
    <!-- Total Width: 9 * 52 + 8 * 14 = 580px -> Start X = 310 -->
    <g transform="translate(310, 72)">
      <!-- 1. C++ -->
      <g transform="translate(0, 0)">
        <rect width="52" height="52" rx="12" fill="#00599C"/>
        <text x="26" y="32" fill="#FFFFFF" font-size="16" class="tb-mono" font-weight="900" text-anchor="middle">C++</text>
      </g>

      <!-- 2. JavaScript -->
      <g transform="translate(66, 0)">
        <rect width="52" height="52" rx="12" fill="#F7DF1E"/>
        <text x="26" y="34" fill="#000000" font-size="20" class="tb-mono" font-weight="900" text-anchor="middle">JS</text>
      </g>

      <!-- 3. TypeScript -->
      <g transform="translate(132, 0)">
        <rect width="52" height="52" rx="12" fill="#3178C6"/>
        <text x="26" y="34" fill="#FFFFFF" font-size="20" class="tb-mono" font-weight="900" text-anchor="middle">TS</text>
      </g>

      <!-- 4. React (Atom) -->
      <g transform="translate(198, 0)">
        <rect width="52" height="52" rx="12" fill="#20232A"/>
        <circle cx="26" cy="26" r="4.5" fill="#61DAFB"/>
        <ellipse cx="26" cy="26" rx="18" ry="7" fill="none" stroke="#61DAFB" stroke-width="1.8"/>
        <ellipse cx="26" cy="26" rx="18" ry="7" fill="none" stroke="#61DAFB" stroke-width="1.8" transform="rotate(60 26 26)"/>
        <ellipse cx="26" cy="26" rx="18" ry="7" fill="none" stroke="#61DAFB" stroke-width="1.8" transform="rotate(120 26 26)"/>
      </g>

      <!-- 5. Next.js -->
      <g transform="translate(264, 0)">
        <rect width="52" height="52" rx="12" fill="#000000" stroke="#333333" stroke-width="1"/>
        <circle cx="26" cy="26" r="18" fill="#111111"/>
        <text x="26" y="33" fill="#FFFFFF" font-size="20" class="tb-mono" font-weight="900" text-anchor="middle">N</text>
      </g>

      <!-- 6. Node.js -->
      <g transform="translate(330, 0)">
        <rect width="52" height="52" rx="12" fill="#339933"/>
        <text x="26" y="34" fill="#FFFFFF" font-size="18" class="tb-mono" font-weight="900" text-anchor="middle">JS</text>
      </g>

      <!-- 7. Tailwind CSS -->
      <g transform="translate(396, 0)">
        <rect width="52" height="52" rx="12" fill="#0B1120" stroke="#0284C7" stroke-width="1"/>
        <path d="M 16 28 C 18 20 24 18 28 22 C 30 24 32 25 34 25 C 37 25 39 23 40 20 C 38 28 32 30 28 26 C 26 24 24 23 22 23 C 19 23 17 25 16 28 Z" fill="#38BDF8"/>
        <path d="M 12 36 C 14 30 18 28 22 31 C 24 32 25 33 27 33 C 29 33 31 31 32 29 C 30 35 26 37 22 34 C 20 33 19 32 18 32 C 15 32 13 34 12 36 Z" fill="#38BDF8"/>
      </g>

      <!-- 8. PostgreSQL -->
      <g transform="translate(462, 0)">
        <rect width="52" height="52" rx="12" fill="#336791"/>
        <text x="26" y="33" fill="#FFFFFF" font-size="13" class="tb-mono" font-weight="900" text-anchor="middle">SQL</text>
      </g>

      <!-- 9. Python -->
      <g transform="translate(528, 0)">
        <rect width="52" height="52" rx="12" fill="#1E293B"/>
        <path d="M26 14 C21 14 20 16 20 18 L20 21 L26 21 L26 22 L17 22 C15 22 13 24 13 27 C13 31 15 32 18 32 L20 32 L20 30 C20 28 22 26 24 26 L30 26 C32 26 33 25 33 23 L33 18 C33 16 31 14 26 14 Z" fill="#38BDF8"/>
        <path d="M26 38 C31 38 32 36 32 34 L32 31 L26 31 L26 30 L35 30 C37 30 39 28 39 25 C39 21 37 20 34 20 L32 20 L32 22 C32 24 30 26 28 26 L22 26 C20 26 19 27 19 29 L19 34 C19 36 21 38 26 38 Z" fill="#FACC15"/>
        <circle cx="23" cy="17" r="1.2" fill="#070B13"/>
        <circle cx="29" cy="35" r="1.2" fill="#070B13"/>
      </g>
    </g>

    <!-- ================= ROW 2: 7 SQUIRCLE TILES (CENTERED) ================= -->
    <!-- Total Width: 7 * 52 + 6 * 14 = 448px -> Start X = 376 -->
    <g transform="translate(376, 140)">
      <!-- 1. Git (Orange) -->
      <g transform="translate(0, 0)">
        <rect width="52" height="52" rx="12" fill="#F05032"/>
        <path d="M26 12 L38 24 L26 36 L14 24 Z" fill="#FFFFFF"/>
        <circle cx="26" cy="24" r="3" fill="#F05032"/>
      </g>

      <!-- 2. GitHub (Dark Octocat) -->
      <g transform="translate(66, 0)">
        <rect width="52" height="52" rx="12" fill="#181717"/>
        <circle cx="26" cy="26" r="15" fill="#FFFFFF"/>
        <circle cx="26" cy="26" r="13" fill="#181717"/>
        <path d="M26 17 C21 17 17 21 17 26 C17 30 20 33 23 34 C24 34 24 34 24 33 L24 31 C20 32 19 30 19 30 C19 29 18 28 18 28 C17 27 18 27 18 27 C19 27 20 28 20 28 C21 29 22 29 23 28 C23 27 24 27 24 26 C21 26 19 25 19 22 C19 21 19 20 20 19 C19 19 19 18 20 17 C21 17 22 17 23 18 C24 18 25 18 26 18 C27 18 28 18 29 18 C30 17 31 17 32 17 C33 18 33 19 32 19 C33 20 33 21 33 22 C33 25 31 26 28 26 C28 27 29 27 29 28 L29 33 C29 34 29 34 30 34 C33 33 35 30 35 26 C35 21 31 17 26 17 Z" fill="#FFFFFF"/>
      </g>

      <!-- 3. VS Code -->
      <g transform="translate(132, 0)">
        <rect width="52" height="52" rx="12" fill="#007ACC"/>
        <path d="M 36 14 L 28 22 L 20 16 L 15 20 L 22 26 L 15 32 L 20 36 L 28 30 L 36 38 Z" fill="#FFFFFF"/>
      </g>

      <!-- 4. HTML5 (Orange 5) -->
      <g transform="translate(198, 0)">
        <rect width="52" height="52" rx="12" fill="#E34F26"/>
        <text x="26" y="35" fill="#FFFFFF" font-size="22" class="tb-mono" font-weight="900" text-anchor="middle">5</text>
      </g>

      <!-- 5. CSS3 (Blue 3) -->
      <g transform="translate(264, 0)">
        <rect width="52" height="52" rx="12" fill="#1572B6"/>
        <text x="26" y="35" fill="#FFFFFF" font-size="22" class="tb-mono" font-weight="900" text-anchor="middle">3</text>
      </g>

      <!-- 6. Power BI (Yellow Bars) -->
      <g transform="translate(330, 0)">
        <rect width="52" height="52" rx="12" fill="#F2C811"/>
        <rect x="16" y="26" width="5" height="12" rx="1.5" fill="#000000"/>
        <rect x="23" y="20" width="5" height="18" rx="1.5" fill="#000000"/>
        <rect x="30" y="14" width="5" height="24" rx="1.5" fill="#000000"/>
      </g>

      <!-- 7. FastAPI (Teal) -->
      <g transform="translate(396, 0)">
        <rect width="52" height="52" rx="12" fill="#059669"/>
        <circle cx="26" cy="26" r="16" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
        <path d="M 27 16 L 20 28 L 26 28 L 25 36 L 32 24 L 26 24 Z" fill="#FFFFFF"/>
      </g>
    </g>

  </g>
</svg>
