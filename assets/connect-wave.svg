<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="1200" height="370" role="img" aria-labelledby="uf-t">
  <title id="uf-t">Shashikant Raj - Let's Connect &amp; Footer</title>
  <defs>
    <linearGradient id="uf-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#190B13"/>
      <stop offset="100%" stop-color="#0C0409"/>
    </linearGradient>
    <linearGradient id="uf-sheen" gradientUnits="userSpaceOnUse" x1="-300" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#E5B5C7"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E5B5C7"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0; 1500 0; 1500 0" keyTimes="0;.4;1" dur="7s" begin="1s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="uf-wave-1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#701A3D" stop-opacity=".75"/>
      <stop offset="50%" stop-color="#C77B9B" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#701A3D" stop-opacity=".75"/>
    </linearGradient>
    <linearGradient id="uf-wave-2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C77B9B"/>
      <stop offset="50%" stop-color="#EF93C4"/>
      <stop offset="100%" stop-color="#701A3D"/>
    </linearGradient>
    <clipPath id="uf-clip"><rect width="1200" height="370" rx="16"/></clipPath>
  </defs>
  <style>
    .uf-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .uf-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
  </style>

  <g clip-path="url(#uf-clip)">
    <!-- Main Card Container -->
    <rect width="1200" height="370" fill="url(#uf-bg)"/>
    <rect x="0.5" y="0.5" width="1199" height="369" rx="15.5" fill="none" stroke="#701A3D" stroke-opacity=".6" stroke-width="1"/>

    <!-- ================= PART 1: SHASHIKANT SIGNATURE ================= -->
    <g transform="translate(600, 68)" text-anchor="middle">
      <!-- Large Signature -->
      <text x="0" y="0" fill="#F8F0F3" font-size="52" class="uf-serif" font-weight="bold" letter-spacing="1">Shashikant</text>
      <text x="0" y="0" fill="url(#uf-sheen)" font-size="52" class="uf-serif" font-weight="bold" letter-spacing="1">Shashikant</text>

      <!-- Tagline -->
      <text x="0" y="32" fill="#E5B5C7" font-size="14.5" class="uf-serif" font-style="italic">Building systems and uncovering patterns that explain themselves.</text>

      <!-- Domain Subtitle -->
      <text x="0" y="58" fill="#A8577D" font-size="11" class="uf-mono" letter-spacing="2.5">DATA ANALYTICS · MACHINE LEARNING · INTELLIGENT SYSTEMS</text>

      <!-- Decorative Divider with Center Node -->
      <line x1="-120" y1="78" x2="120" y2="78" stroke="#701A3D" stroke-width="1"/>
      <circle cx="0" cy="78" r="3" fill="#E5B5C7"/>
    </g>

    <!-- ================= PART 2: LET'S CONNECT & BUTTONS ================= -->
    <g transform="translate(600, 185)" text-anchor="middle">
      <!-- Section Title -->
      <text x="0" y="0" fill="#EF93C4" font-size="19" class="uf-mono" font-weight="bold">🌐 Let's Connect</text>

      <!-- Button Row (LinkedIn, GitHub, LeetCode, Portfolio, Email) -->
      <g transform="translate(0, 36)">
        <!-- LinkedIn (Blue) -->
        <g transform="translate(-240, 0)">
          <rect width="105" height="32" rx="6" fill="#0A66C2" x="-52.5" y="-16"/>
          <text x="0" y="5" fill="#FFFFFF" font-size="11" class="uf-mono" font-weight="bold">LINKEDIN</text>
        </g>

        <!-- GitHub (Dark) -->
        <g transform="translate(-120, 0)">
          <rect width="95" height="32" rx="6" fill="#24292E" stroke="#701A3D" stroke-width="1" x="-47.5" y="-16"/>
          <text x="0" y="5" fill="#FFFFFF" font-size="11" class="uf-mono" font-weight="bold">GITHUB</text>
        </g>

        <!-- LeetCode (Orange) -->
        <g transform="translate(0, 0)">
          <rect width="105" height="32" rx="6" fill="#FFA116" x="-52.5" y="-16"/>
          <text x="0" y="5" fill="#000000" font-size="11" class="uf-mono" font-weight="bold">LEETCODE</text>
        </g>

        <!-- Portfolio (Magenta) -->
        <g transform="translate(125, 0)">
          <rect width="105" height="32" rx="6" fill="#701A3D" stroke="#C77B9B" stroke-width="1" x="-52.5" y="-16"/>
          <text x="0" y="5" fill="#F8F0F3" font-size="11" class="uf-mono" font-weight="bold">PORTFOLIO</text>
        </g>

        <!-- Email (Red) -->
        <g transform="translate(245, 0)">
          <rect width="90" height="32" rx="6" fill="#EA4335" x="-45" y="-16"/>
          <text x="0" y="5" fill="#FFFFFF" font-size="11" class="uf-mono" font-weight="bold">EMAIL</text>
        </g>
      </g>

      <!-- Catchphrase (From Video 2) -->
      <text x="0" y="78" fill="#E5B5C7" font-size="14" class="uf-serif" font-style="italic">See you in the next commit 🌟</text>
    </g>

    <!-- ================= PART 3: SYNTHWAVE WAVES (BOTTOM) ================= -->
    <!-- Back Wave -->
    <path d="M 0 315 Q 300 280 600 312 T 1200 295 L 1200 370 L 0 370 Z" fill="url(#uf-wave-1)"/>

    <!-- Front Wave -->
    <path d="M 0 332 Q 350 300 700 336 T 1200 322 L 1200 370 L 0 370 Z" fill="url(#uf-wave-2)"/>
  </g>
</svg>
