<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="1200" height="370" role="img" aria-labelledby="uf-t">
  <title id="uf-t">Shashikant Raj - Let's Connect &amp; Footer</title>
  <defs>
    <linearGradient id="uf-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E172A"/>
      <stop offset="100%" stop-color="#070B13"/>
    </linearGradient>
    <linearGradient id="uf-sheen" gradientUnits="userSpaceOnUse" x1="-300" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0; 1500 0; 1500 0" keyTimes="0;.4;1" dur="7s" begin="1s" repeatCount="indefinite"/>
    </linearGradient>
    <!-- Dual Synthwave Waves: Electric Blue & Neon Red -->
    <linearGradient id="uf-wave-blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E3A8A" stop-opacity=".8"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity=".6"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity=".75"/>
    </linearGradient>
    <linearGradient id="uf-wave-red" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#EF4444" stop-opacity=".8"/>
      <stop offset="50%" stop-color="#F43F5E" stop-opacity=".6"/>
      <stop offset="100%" stop-color="#991B1B" stop-opacity=".8"/>
    </linearGradient>
    <clipPath id="uf-clip"><rect width="1200" height="370" rx="16"/></clipPath>
  </defs>
  <style>
    .uf-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "JetBrains Mono", monospace; }
    .uf-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Space Grotesk", sans-serif; }
    .uf-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
  </style>

  <g clip-path="url(#uf-clip)">
    <rect width="1200" height="370" fill="url(#uf-bg)"/>
    <rect x="0.5" y="0.5" width="1199" height="369" rx="15.5" fill="none" stroke="#3B82F6" stroke-opacity=".3" stroke-width="1"/>

    <!-- ================= PART 1: SHASHIKANT SIGNATURE ================= -->
    <g transform="translate(600, 68)" text-anchor="middle">
      <text x="0" y="0" fill="#FFFFFF" font-size="52" class="uf-serif" font-weight="bold" letter-spacing="1">Shashikant</text>
      <text x="0" y="0" fill="url(#uf-sheen)" font-size="52" class="uf-serif" font-weight="bold" letter-spacing="1">Shashikant</text>

      <text x="0" y="32" fill="#94A3B8" font-size="14.5" class="uf-serif" font-style="italic">Building systems and uncovering patterns that explain themselves.</text>
      <text x="0" y="58" fill="#38BDF8" font-size="11" class="uf-mono" letter-spacing="2.5">DATA ANALYTICS · MACHINE LEARNING · INTELLIGENT SYSTEMS</text>

      <line x1="-140" y1="78" x2="140" y2="78" stroke="#1E293B" stroke-width="1"/>
      <circle cx="0" cy="78" r="3.5" fill="#EF4444"/>
    </g>

    <!-- ================= PART 2: LET'S CONNECT & BUTTONS ================= -->
    <g transform="translate(600, 185)" text-anchor="middle">
      <text x="0" y="0" fill="#38BDF8" font-size="19" class="uf-mono" font-weight="bold">🌐 Let's Connect</text>

      <!-- Button Row (LinkedIn, GitHub, LeetCode, Portfolio, Email) -->
      <g transform="translate(0, 36)">
        <!-- LinkedIn (Blue) -->
        <g transform="translate(-240, 0)">
          <rect width="105" height="32" rx="6" fill="#0A66C2" x="-52.5" y="-16"/>
          <text x="0" y="5" fill="#FFFFFF" font-size="11" class="uf-mono" font-weight="bold">LINKEDIN</text>
        </g>

        <!-- GitHub (Dark) -->
        <g transform="translate(-120, 0)">
          <rect width="95" height="32" rx="6" fill="#1E293B" stroke="#3B82F6" stroke-width="1" x="-47.5" y="-16"/>
          <text x="0" y="5" fill="#FFFFFF" font-size="11" class="uf-mono" font-weight="bold">GITHUB</text>
        </g>

        <!-- LeetCode (Orange) -->
        <g transform="translate(0, 0)">
          <rect width="105" height="32" rx="6" fill="#FFA116" x="-52.5" y="-16"/>
          <text x="0" y="5" fill="#000000" font-size="11" class="uf-mono" font-weight="bold">LEETCODE</text>
        </g>

        <!-- Portfolio (Neon Blue) -->
        <g transform="translate(125, 0)">
          <rect width="105" height="32" rx="6" fill="#2563EB" stroke="#38BDF8" stroke-width="1" x="-52.5" y="-16"/>
          <text x="0" y="5" fill="#FFFFFF" font-size="11" class="uf-mono" font-weight="bold">PORTFOLIO</text>
        </g>

        <!-- Email (Neon Red) -->
        <g transform="translate(245, 0)">
          <rect width="90" height="32" rx="6" fill="#EF4444" x="-45" y="-16"/>
          <text x="0" y="5" fill="#FFFFFF" font-size="11" class="uf-mono" font-weight="bold">EMAIL</text>
        </g>
      </g>

      <text x="0" y="78" fill="#94A3B8" font-size="14" class="uf-serif" font-style="italic">See you in the next commit ⚡</text>
    </g>

    <!-- ================= PART 3: DUAL SYNTHWAVE WAVES (BOTTOM) ================= -->
    <!-- Back Wave (Red) -->
    <path d="M 0 315 Q 300 275 600 310 T 1200 292 L 1200 370 L 0 370 Z" fill="url(#uf-wave-red)"/>

    <!-- Front Wave (Blue) -->
    <path d="M 0 332 Q 350 298 700 334 T 1200 320 L 1200 370 L 0 370 Z" fill="url(#uf-wave-blue)"/>
  </g>
</svg>
