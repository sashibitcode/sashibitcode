      <g transform="translate(0, 52)">
        <text x="0" y="0" fill="#A8577D" font-size="12" class="ab-mono">01 · CURRENT ROLE</text>
        <text x="180" y="0" fill="#F8F0F3" font-size="12.5" class="ab-mono" font-weight="600">: AI &amp; Data Science Intern @ Knowx Innovations (Jul–Aug 2026)</text>
      </g>

      <g transform="translate(0, 92)">
