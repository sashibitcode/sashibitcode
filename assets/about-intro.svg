<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="ab-t ab-d">
  <title id="ab-t">About Shashikant Raj</title>
  <desc id="ab-d">Data Analyst and AI/ML Engineer. B.Tech Computer Science at Jagannath University, Jaipur. AI &amp; Data Science Intern at Knowx Innovations.</desc>
  <defs>
    <linearGradient id="ab-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#190B12"/><stop offset="1" stop-color="#10070C"/></linearGradient>
    <radialGradient id="ab-glow" cx="80%" cy="20%" r="70%"><stop offset="0" stop-color="#701A3D" stop-opacity=".6"/><stop offset="1" stop-color="#451126" stop-opacity="0"/></radialGradient>
    <pattern id="ab-scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#F8F0F3" opacity=".025"/></pattern>
    <clipPath id="ab-clip"><rect width="1200" height="420" rx="16"/></clipPath>
  </defs>
  <style>
    .ab-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .ab-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .ab-fade { animation: ab-fade 1.2s cubic-bezier(.16,1,.3,1) both; }
    @keyframes ab-fade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  </style>

  <g clip-path="url(#ab-clip)">
