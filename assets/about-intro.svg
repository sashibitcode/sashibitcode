        <text x="0" y="14" fill="#F8F0F3" font-size="11.5" class="ab-mono">Power BI Dashboards</text>
        <text x="215" y="14" fill="#C77B9B" font-size="11" class="ab-mono">94%</text>
        <rect x="0" y="24" width="260" height="6" rx="3" fill="#280F1E"/>
        <rect x="0" y="24" width="245" height="6" rx="3" fill="#E5B5C7"/>
      </g>

