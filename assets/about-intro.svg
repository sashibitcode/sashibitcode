        <text x="215" y="14" fill="#C77B9B" font-size="11" class="ab-mono">92%</text>
        <rect x="0" y="24" width="260" height="6" rx="3" fill="#280F1E"/>
        <rect x="0" y="24" width="240" height="6" rx="3" fill="#C77B9B"/>
