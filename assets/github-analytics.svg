<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="1200" height="370" role="img" aria-labelledby="ga-t">
  <title id="ga-t">GitHub Activity Graph &amp; Telemetry</title>
  <defs>
    <linearGradient id="ga-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E172A"/>
      <stop offset="100%" stop-color="#070B13"/>
    </linearGradient>
    <linearGradient id="ga-curve-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity=".45"/>
      <stop offset="70%" stop-color="#38BDF8" stop-opacity=".1"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="ga-clip"><rect width="1200" height="370" rx="16"/></clipPath>
  </defs>
  <style>
    .ga-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "JetBrains Mono", monospace; }
    .ga-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Space Grotesk", sans-serif; }
  </style>

  <g clip-path="url(#ga-clip)">
    <rect width="1200" height="370" fill="url(#ga-bg)"/>
    <rect x="0.5" y="0.5" width="1199" height="369" rx="15.5" fill="none" stroke="#3B82F6" stroke-opacity=".3" stroke-width="1"/>

    <!-- Header -->
    <text x="36" y="44" fill="#38BDF8" font-size="13" class="ga-mono" font-weight="bold">~/ ACTIVITY GRAPH</text>
    <text x="180" y="44" fill="#64748B" font-size="13" class="ga-mono">· CONTINUOUS CONTRIBUTION VELOCITY</text>

    <!-- Stat Highlights on Top Right -->
    <g transform="translate(820, 26)">
      <rect width="340" height="42" rx="8" fill="#0A111F" stroke="#1E293B" stroke-width="1"/>
      <text x="18" y="26" fill="#94A3B8" font-size="11" class="ga-mono">COMMITS (2026):</text>
      <text x="125" y="26" fill="#38BDF8" font-size="12" class="ga-mono" font-weight="bold">280+</text>
      <text x="195" y="26" fill="#94A3B8" font-size="11" class="ga-mono">PRs:</text>
      <text x="230" y="26" fill="#EF4444" font-size="12" class="ga-mono" font-weight="bold">34</text>
      <text x="270" y="26" fill="#94A3B8" font-size="11" class="ga-mono">REPOS:</text>
      <text x="315" y="26" fill="#38BDF8" font-size="12" class="ga-mono" font-weight="bold">10</text>
    </g>

    <!-- Activity Line Graph -->
    <g transform="translate(36, 90)">
      <!-- Grid Lines -->
      <line x1="0" y1="0" x2="1120" y2="0" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 4"/>
      <line x1="0" y1="50" x2="1120" y2="50" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 4"/>
      <line x1="0" y1="100" x2="1120" y2="100" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 4"/>
      <line x1="0" y1="150" x2="1120" y2="150" stroke="#1E293B" stroke-width="1"/>

      <!-- Area Gradient Fill -->
      <path d="M 0 150 L 0 120 Q 80 140 160 90 T 320 110 T 480 50 T 640 70 T 800 30 T 960 45 T 1120 15 L 1120 150 Z" fill="url(#ga-curve-fill)"/>

      <!-- Smooth Activity Curve -->
      <path d="M 0 120 Q 80 140 160 90 T 320 110 T 480 50 T 640 70 T 800 30 T 960 45 T 1120 15" fill="none" stroke="#38BDF8" stroke-width="2.5"/>

      <!-- High-Intensity Nodes -->
      <circle cx="480" cy="50" r="4" fill="#3B82F6" stroke="#FFFFFF" stroke-width="1.5"/>
      <circle cx="800" cy="30" r="4.5" fill="#EF4444" stroke="#FFFFFF" stroke-width="1.5"/>
      <circle cx="1120" cy="15" r="5" fill="#38BDF8" stroke="#FFFFFF" stroke-width="2"/>

      <!-- Month Labels -->
      <g transform="translate(0, 175)" fill="#64748B" font-size="11" class="ga-mono">
        <text x="10">Nov</text>
        <text x="110">Dec</text>
        <text x="210">Jan</text>
        <text x="310">Feb</text>
        <text x="410">Mar</text>
        <text x="510">Apr</text>
        <text x="610">May</text>
        <text x="710">Jun</text>
        <text x="810">Jul</text>
        <text x="910">Aug</text>
        <text x="1010">Sep</text>
        <text x="1090">Oct</text>
      </g>
    </g>

    <!-- Bottom Language Telemetry Strip -->
    <g transform="translate(36, 310)">
      <text x="0" y="16" fill="#94A3B8" font-size="11.5" class="ga-mono">LANGUAGES:</text>
      <g transform="translate(100, 4)">
        <rect width="18" height="14" rx="2" fill="#3B82F6"/><text x="24" y="12" fill="#CBD5E1" font-size="11" class="ga-mono">Python (52%)</text>
        <rect x="150" width="18" height="14" rx="2" fill="#EF4444"/><text x="174" y="12" fill="#CBD5E1" font-size="11" class="ga-mono">SQL (24%)</text>
        <rect x="270" width="18" height="14" rx="2" fill="#38BDF8"/><text x="294" y="12" fill="#CBD5E1" font-size="11" class="ga-mono">JavaScript (14%)</text>
        <rect x="420" width="18" height="14" rx="2" fill="#F59E0B"/><text x="444" y="12" fill="#CBD5E1" font-size="11" class="ga-mono">TypeScript (10%)</text>
      </g>
    </g>
  </g>
</svg>
