<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="1200" height="240" role="img" aria-labelledby="cert-t">
  <title id="cert-t">Certifications &amp; Verified Credentials</title>
  <defs>
    <linearGradient id="cert-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E172A"/>
      <stop offset="100%" stop-color="#070B13"/>
    </linearGradient>
    <clipPath id="cert-clip"><rect width="1200" height="240" rx="14"/></clipPath>
  </defs>
  <style>
    .c-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "JetBrains Mono", monospace; }
    .c-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Space Grotesk", sans-serif; }
  </style>
  <g clip-path="url(#cert-clip)">
    <rect width="1200" height="240" fill="url(#cert-bg)"/>
    <rect x="0.5" y="0.5" width="1199" height="239" rx="13.5" fill="none" stroke="#3B82F6" stroke-opacity=".3" stroke-width="1"/>

    <!-- Row 1: Cert 1 (Cisco) & Cert 2 (HackerRank SQL) -->
    <!-- Cert 1: Cisco PCAP -->
    <g transform="translate(36, 24)">
      <rect width="544" height="88" rx="8" fill="#0A111F" stroke="#1E293B" stroke-width="1"/>
      <rect width="4" height="88" rx="2" fill="#3B82F6"/>
      <text x="20" y="26" fill="#38BDF8" font-size="11" class="c-mono" font-weight="bold">CISCO NETWORKING ACADEMY · OPENEDG</text>
      <text x="20" y="48" fill="#FFFFFF" font-size="14.5" class="c-sans" font-weight="800">PCAP: Programming Essentials in Python</text>
      <text x="20" y="70" fill="#94A3B8" font-size="11" class="c-mono">Core Python syntax, data structures, OOP patterns · Verified July 2024 ↗</text>
    </g>

    <!-- Cert 2: HackerRank SQL Intermediate -->
    <g transform="translate(620, 24)">
      <rect width="544" height="88" rx="8" fill="#0A111F" stroke="#1E293B" stroke-width="1"/>
      <rect width="4" height="88" rx="2" fill="#10B981"/>
      <text x="20" y="26" fill="#34D399" font-size="11" class="c-mono" font-weight="bold">HACKERRANK CERTIFIED</text>
      <text x="20" y="48" fill="#FFFFFF" font-size="14.5" class="c-sans" font-weight="800">SQL (Intermediate) — Complex Queries &amp; Window Functions</text>
      <text x="20" y="70" fill="#94A3B8" font-size="11" class="c-mono">Multi-table joins, subqueries, aggregations · Verified October 2026 ↗</text>
    </g>

    <!-- Row 2: Cert 3 (Forage Data Vis) & Cert 4 (Google Cloud GenAI) -->
    <!-- Cert 3: Tata / Forage -->
    <g transform="translate(36, 128)">
      <rect width="544" height="88" rx="8" fill="#0A111F" stroke="#1E293B" stroke-width="1"/>
      <rect width="4" height="88" rx="2" fill="#EF4444"/>
      <text x="20" y="26" fill="#EF4444" font-size="11" class="c-mono" font-weight="bold">TATA / FORAGE</text>
      <text x="20" y="48" fill="#FFFFFF" font-size="14.5" class="c-sans" font-weight="800">Data Visualisation: Empowering Business with Insights</text>
      <text x="20" y="70" fill="#94A3B8" font-size="11" class="c-mono">Executive dashboards, KPI interpretation · Verified July 2025 ↗</text>
    </g>

    <!-- Cert 4: Google Generative AI -->
    <g transform="translate(620, 128)">
      <rect width="544" height="88" rx="8" fill="#0A111F" stroke="#1E293B" stroke-width="1"/>
      <rect width="4" height="88" rx="2" fill="#38BDF8"/>
      <text x="20" y="26" fill="#38BDF8" font-size="11" class="c-mono" font-weight="bold">GOOGLE CLOUD</text>
      <text x="20" y="48" fill="#FFFFFF" font-size="14.5" class="c-sans" font-weight="800">Introduction to Generative AI Studio</text>
      <text x="20" y="70" fill="#94A3B8" font-size="11" class="c-mono">LLM foundations &amp; prompt tuning workflows · Verified July 2025 ↗</text>
    </g>
  </g>
</svg>
