<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="w-t">
  <title id="w-t">~/ whoami - Shashikant Raj</title>
  <defs>
    <linearGradient id="w-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E172A"/>
      <stop offset="100%" stop-color="#070B13"/>
    </linearGradient>
    <clipPath id="w-clip"><rect width="1200" height="320" rx="16"/></clipPath>
  </defs>
  <style>
    .w-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "JetBrains Mono", monospace; }
    .w-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  </style>

  <g clip-path="url(#w-clip)">
    <!-- Base Card -->
    <rect width="1200" height="320" fill="url(#w-bg)"/>
    <rect x="0.5" y="0.5" width="1199" height="319" rx="15.5" fill="none" stroke="#3B82F6" stroke-opacity=".25" stroke-width="1"/>

    <!-- Section Title: ~/ whoami -->
    <text x="36" y="44" fill="#FFFFFF" font-size="22" class="w-mono" font-weight="bold">
      <tspan fill="#38BDF8">~/</tspan> whoami
    </text>

    <!-- Command Bar Box: $ cat about.txt -->
    <g transform="translate(36, 62)">
      <rect width="1128" height="42" rx="8" fill="#0A111F" stroke="#1E293B" stroke-width="1"/>
      <text x="20" y="26" fill="#38BDF8" font-size="14.5" class="w-mono" font-weight="bold">
        $ <tspan fill="#FFFFFF">cat about.txt</tspan>
      </text>
    </g>

    <!-- Body Text (Intro Sentence) -->
    <text x="36" y="138" fill="#E2E8F0" font-size="15" class="w-sans">
      Hi, I'm <tspan fill="#FFFFFF" font-weight="bold">Shashikant Raj</tspan>. I build things that sit somewhere between data analytics and full-stack AI, and I solve problems when neither of those is cooperating.
    </text>

    <!-- Bullet Points -->
    <!-- Bullet 1: Currently building -->
    <g transform="translate(36, 172)">
      <circle cx="8" cy="-5" r="3" fill="#94A3B8"/>
      <text x="22" y="0" fill="#CBD5E1" font-size="14.5" class="w-sans">
        Currently building <tspan fill="#3B82F6" font-weight="bold">sas-ai</tspan> and <tspan fill="#3B82F6" font-weight="bold">quickdownload</tspan>
      </text>
    </g>

    <!-- Bullet 2: Portfolio -->
    <g transform="translate(36, 202)">
      <circle cx="8" cy="-5" r="3" fill="#94A3B8"/>
      <text x="22" y="0" fill="#CBD5E1" font-size="14.5" class="w-sans">
        Portfolio: <tspan fill="#38BDF8" text-decoration="underline">sashibitcode.vercel.app</tspan>
      </text>
    </g>

    <!-- Bullet 3: Core Stack -->
    <g transform="translate(36, 232)">
      <circle cx="8" cy="-5" r="3" fill="#94A3B8"/>
      <text x="22" y="0" fill="#CBD5E1" font-size="14.5" class="w-sans">
        Core Stack: <tspan fill="#FFFFFF">Python · SQL · Power BI · Pandas · FastAPI · Next.js / React</tspan>
      </text>
    </g>

    <!-- Bullet 4: Education -->
    <g transform="translate(36, 262)">
      <circle cx="8" cy="-5" r="3" fill="#94A3B8"/>
      <text x="22" y="0" fill="#CBD5E1" font-size="14.5" class="w-sans">
        Education: <tspan fill="#FFFFFF">B.Tech Computer Science &amp; Engineering @ Jagannath University, Jaipur</tspan>
      </text>
    </g>

    <!-- Bullet 5: Fun fact -->
    <g transform="translate(36, 292)">
      <circle cx="8" cy="-5" r="3" fill="#94A3B8"/>
      <text x="22" y="0" fill="#CBD5E1" font-size="14.5" class="w-sans">
        Fun fact: <tspan fill="#94A3B8" font-style="italic">I started coding seriously because I wanted to build things I wished existed.</tspan>
      </text>
    </g>

  </g>
</svg>
