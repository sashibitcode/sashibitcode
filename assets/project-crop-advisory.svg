          <text x="9" y="16" fill="#E5B5C7" font-size="11" class="pj-mono" font-weight="600">Scikit-learn</text>
        </g>
        
        <g transform="translate(200, 0)">
          <rect width="98" height="24" rx="4" fill="#240C1B" stroke="#C77B9B" stroke-opacity=".3" stroke-width="1"/>
          <text x="9" y="16" fill="#E5B5C7" font-size="11" class="pj-mono" font-weight="600">TensorFlow</text>
        </g>
        
        <g transform="translate(308, 0)">
