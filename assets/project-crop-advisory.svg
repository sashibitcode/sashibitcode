    <rect width="1200" height="270" fill="url(#pj-glow-04)"/>
    <rect x="0.5" y="0.5" width="1199" height="269" rx="13.5" fill="none" stroke="#701A3D" stroke-opacity=".5" stroke-width="1"/>

    <g transform="translate(40, 32)">
      <!-- Top Metadata Header -->
      <g>
        <rect width="28" height="18" rx="3" fill="#200B17" stroke="#701A3D" stroke-width="1"/>
        <text x="6" y="13" fill="#E5B5C7" font-size="10.5" class="pj-mono" font-weight="bold">04</text>
        <text x="36" y="13" fill="#C77B9B" font-size="11" class="pj-mono" font-weight="600" letter-spacing="2">MACHINE LEARNING · RAG ARCHITECTURE · 2026</text>
      </g>

      <!-- Project Title -->
      <text x="0" y="58" fill="#F8F0F3" font-size="28" class="pj-serif" font-weight="bold" letter-spacing="-0.3">Real-Time Crop Advisory AI System</text>

      <!-- Description -->
      <text x="0" y="88" fill="#E5B5C7" font-size="13.5" class="pj-sans" width="750">Engineered at Knowx Innovations Pvt. Ltd. Integrating ML classification with Retrieval-Augmented Generation for agronomy advisory.</text>

      <!-- Metrics Row -->
      <g transform="translate(0, 114)">
        
        <g transform="translate(0, 0)">
          <rect width="170" height="52" rx="6" fill="#1C0915" stroke="#701A3D" stroke-opacity=".7" stroke-width="1"/>
          <text x="12" y="20" fill="#A8577D" font-size="10" class="pj-mono" font-weight="bold" letter-spacing="1">ARCHITECTURE</text>
          <text x="12" y="42" fill="#F8F0F3" font-size="16" class="pj-serif" font-weight="bold">RAG + ML</text>
        </g>
        
        <g transform="translate(182, 0)">
          <rect width="170" height="52" rx="6" fill="#1C0915" stroke="#701A3D" stroke-opacity=".7" stroke-width="1"/>
          <text x="12" y="20" fill="#A8577D" font-size="10" class="pj-mono" font-weight="bold" letter-spacing="1">INFERENCE</text>
          <text x="12" y="42" fill="#F8F0F3" font-size="16" class="pj-serif" font-weight="bold">Real-Time</text>
        </g>
        
        <g transform="translate(364, 0)">
          <rect width="170" height="52" rx="6" fill="#1C0915" stroke="#701A3D" stroke-opacity=".7" stroke-width="1"/>
          <text x="12" y="20" fill="#A8577D" font-size="10" class="pj-mono" font-weight="bold" letter-spacing="1">ADVISORY</text>
          <text x="12" y="42" fill="#F8F0F3" font-size="16" class="pj-serif" font-weight="bold">Dynamic Insights</text>
        </g>
        
        <g transform="translate(546, 0)">
