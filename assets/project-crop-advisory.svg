          <text x="9" y="16" fill="#E5B5C7" font-size="11" class="pj-mono" font-weight="600">Knowx Innovations</text>
        </g>
        
        <g transform="translate(524, 0)">
          <rect width="106" height="24" rx="4" fill="#240C1B" stroke="#C77B9B" stroke-opacity=".3" stroke-width="1"/>
          <text x="9" y="16" fill="#E5B5C7" font-size="11" class="pj-mono" font-weight="600">Agronomy AI</text>
        </g>
        
      </g>

      <!-- Right Action Indicator -->
      <g transform="translate(1000, 180)">
        <rect width="120" height="28" rx="4" fill="#2A0E20" stroke="#E5B5C7" stroke-opacity=".6" stroke-width="1"/>
        <text x="18" y="18" fill="#F8F0F3" font-size="11" class="pj-mono" font-weight="bold" letter-spacing="1">VIEW REPO →</text>
