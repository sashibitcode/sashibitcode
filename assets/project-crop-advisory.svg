          <text x="12" y="20" fill="#A8577D" font-size="10" class="pj-mono" font-weight="bold" letter-spacing="1">FRAMEWORK</text>
          <text x="12" y="42" fill="#F8F0F3" font-size="16" class="pj-serif" font-weight="bold">TensorFlow</text>
        </g>
        
      </g>

