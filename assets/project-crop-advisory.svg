<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 270" width="1200" height="270" role="img" aria-label="Real-Time Crop Advisory AI System">
  <defs>
    <linearGradient id="pj-bg-04" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B0B14"/><stop offset="1" stop-color="#10070C"/></linearGradient>
    <radialGradient id="pj-glow-04" cx="95%" cy="30%" r="50%"><stop offset="0" stop-color="#701A3D" stop-opacity=".45"/><stop offset="1" stop-color="#701A3D" stop-opacity="0"/></radialGradient>
    <clipPath id="pj-clip-04"><rect width="1200" height="270" rx="14"/></clipPath>
  </defs>
  <style>
    .pj-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .pj-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .pj-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <g clip-path="url(#pj-clip-04)">
