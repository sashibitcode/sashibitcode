<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="Shashikant signature footer">
  <defs>
    <linearGradient id="ft-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#190B12"/><stop offset="1" stop-color="#10070C"/></linearGradient>
    <linearGradient id="ft-sheen" gradientUnits="userSpaceOnUse" x1="-300" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#E5B5C7"/>
      <stop offset=".5" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E5B5C7"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0; 1500 0; 1500 0" keyTimes="0;.4;1" dur="7s" begin="1s" repeatCount="indefinite"/>
    </linearGradient>
    <clipPath id="ft-clip"><rect width="1200" height="260" rx="16"/></clipPath>
  </defs>
  <style>
    .ft-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .ft-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
  </style>

  <g clip-path="url(#ft-clip)">
    <rect width="1200" height="260" fill="url(#ft-bg)"/>
    <rect x="0.5" y="0.5" width="1199" height="259" rx="15.5" fill="none" stroke="#701A3D" stroke-opacity=".5" stroke-width="1"/>

    <g transform="translate(600, 120)" text-anchor="middle">
      <!-- Large Signature Display -->
      <text x="0" y="0" fill="#F8F0F3" font-size="54" class="ft-serif" font-weight="bold" letter-spacing="1">Shashikant</text>
      <text x="0" y="0" fill="url(#ft-sheen)" font-size="54" class="ft-serif" font-weight="bold" letter-spacing="1">Shashikant</text>

      <!-- Tagline -->
      <text x="0" y="38" fill="#E5B5C7" font-size="15" class="ft-serif" font-style="italic">Building systems and uncovering patterns that explain themselves.</text>

      <!-- Subtitle -->
      <text x="0" y="70" fill="#A8577D" font-size="11.5" class="ft-mono" letter-spacing="3">DATA ANALYTICS · MACHINE LEARNING · INTELLIGENT SYSTEMS</text>
      
      <!-- Bottom decorative node -->
      <line x1="-120" y1="95" x2="120" y2="95" stroke="#701A3D" stroke-width="1"/>
      <circle cx="0" cy="95" r="3" fill="#E5B5C7"/>
    </g>
  </g>
</svg>
